<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Templo Satori · Método Kaizen — Sendero de los 33 Grados</title>
  <meta name="description" content="Templo Satori: logia digital de Masonería Liberal — el despertar como destino, el Método Kaizen como camino. 33 grados, gamificación y neurociencias." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23d4af37'%3E%E2%97%AC%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="stars" aria-hidden="true"></div>

  <!-- Velo de transición: las puertas del Templo entre escenas -->
  <div id="veil" aria-hidden="true">
    <div class="veil-panel veil-left"></div>
    <div class="veil-panel veil-right"></div>
  </div>

  <!-- HUD -->
  <header id="hud" class="hud hidden">
    <div class="hud-left">
      <span class="hud-symbol" aria-hidden="true">◬</span>
      <span id="hud-name">Buscador</span>
    </div>
    <div class="hud-center">
      <span id="hud-grade" class="hud-grade">Profano</span>
    </div>
    <div class="hud-right">
      <span class="hud-light" title="Luz acumulada">☀ <span id="hud-light">0</span></span>
      <button id="btn-library" class="hud-btn" title="Biblioteca de los Maestros">📚</button>
      <button id="btn-audio" class="hud-btn" title="Armonías del Templo — audio neuroestimulante">♫</button>
      <button id="btn-map" class="hud-btn" title="Plano del Templo">🗺</button>
      <button id="btn-gym" class="hud-btn" title="Gimnasio Neuronal — repaso activo">🧠</button>
      <button id="btn-tabla" class="hud-btn" title="Tabla de Trazar — Caballete">△ Tabla</button>
      <button id="btn-journal" class="hud-btn" title="Diario del Iniciado">✎ Diario</button>
      <button id="btn-reset" class="hud-btn" title="Reiniciar el viaje">⟲</button>
    </div>
  </header>

  <!-- Escenas -->
  <main id="scene-root"></main>

  <!-- Modal de reto -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop"></div>
    <div class="modal-card" id="modal-card"></div>
  </div>

  <!-- Diario -->
  <div id="journal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop"></div>
    <div class="modal-card journal-card">
      <h2 class="modal-title">Diario del Iniciado</h2>
      <p class="journal-hint">Aquí se conservan tus reflexiones. Son tu piedra tallada.</p>
      <div id="journal-entries"></div>
      <button class="btn btn-ghost" id="journal-close">Cerrar</button>
    </div>
  </div>

  <!-- Tabla de Trazar (Caballete) -->
  <div id="tabla" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop"></div>
    <div class="modal-card tabla-card">
      <div id="tabla-content"></div>
      <button class="btn btn-ghost" id="tabla-close">Cerrar</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
