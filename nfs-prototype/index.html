<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TURBO PURSUIT — prototipo NFS × retro Nintendo</title>
<style>
  :root{
    --ink:#1b1d2e; --paper:#fffdf5; --accent:#ff3d54; --accent2:#ffd23f; --sky:#35b6ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0b0d1a;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0d1a}
  canvas#game{width:100vw;height:100vh;object-fit:contain;image-rendering:auto;display:block}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;display:none}
  .chunk{font-weight:900;letter-spacing:.5px;color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.5), -2px 0 0 rgba(0,0,0,.35), 2px 0 0 rgba(0,0,0,.35)}
  #speedBox{position:absolute;right:2.2%;bottom:3.5%;text-align:right}
  #speedVal{font-size:min(9vh,64px);line-height:1;font-style:italic}
  #speedUnit{font-size:min(2.6vh,18px);opacity:.9;margin-top:-4px}
  #nitroWrap{position:absolute;right:2.2%;bottom:16%;width:min(24vw,210px)}
  #nitroLabel{font-size:min(2vh,14px);margin-bottom:3px;text-align:right}
  #nitroBar{height:min(2.4vh,16px);border-radius:99px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.85);overflow:hidden}
  #nitroFill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#28e0ff,#7cf29c);transition:width .08s linear}
  #lapBox{position:absolute;left:2.2%;top:2.8%;font-size:min(3.6vh,26px)}
  #timeBox{position:absolute;left:2.2%;top:calc(2.8% + min(4.4vh,32px));font-size:min(2.6vh,19px);opacity:.95}
  #bestBox{position:absolute;left:2.2%;top:calc(2.8% + min(8vh,58px));font-size:min(2.2vh,16px);color:#ffe36e}
  #posBox{position:absolute;right:2.2%;top:2.4%;text-align:right}
  #posVal{font-size:min(8vh,58px);line-height:.95;font-style:italic;color:#ffd23f}
  #posOrd{font-size:min(2.4vh,17px)}
  #msgFlash{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:min(6vh,44px);opacity:0;transition:opacity .25s;white-space:nowrap;font-style:italic}
  #muteHint{position:absolute;right:2.2%;bottom:1%;font-size:11px;opacity:.55;color:#fff}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(120% 100% at 50% 0%, rgba(20,26,58,.72), rgba(8,10,22,.9));color:#fff;text-align:center;z-index:5}
  .hidden{display:none!important}
  #title h1{font-size:min(11vw,84px);font-weight:900;font-style:italic;letter-spacing:1px;line-height:.95;
    background:linear-gradient(180deg,#fff 20%,#ffd23f 55%,#ff7b3d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(255,122,61,.35))}
  #title .sub{font-size:min(3.4vw,17px);letter-spacing:4px;color:#8fe3ff;font-weight:800;text-transform:uppercase}
  #title .badge{margin-top:2px;font-size:min(3vw,13px);color:#ffd23f;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.5);
    padding:4px 14px;border-radius:99px;font-weight:800;letter-spacing:2px}
  .press{margin-top:16px;font-size:min(4.4vw,22px);font-weight:900;color:#fff;animation:blink 1.1s steps(2) infinite;cursor:pointer;pointer-events:auto;
    background:linear-gradient(180deg,#ff5d72,#e01f3d);padding:12px 34px;border-radius:16px;border:0;
    box-shadow:0 5px 0 #8f1027, 0 8px 18px rgba(0,0,0,.5);letter-spacing:1px}
  .press:active{transform:translateY(4px);box-shadow:0 1px 0 #8f1027}
  @keyframes blink{50%{filter:brightness(1.25)}}
  .controls{margin-top:14px;font-size:min(3.2vw,14px);line-height:1.9;color:#c9d4ff}
  .controls b{color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:1px 8px;font-weight:800}
  #countNum{font-size:min(34vh,220px);font-weight:900;font-style:italic;color:#ffd23f;
    text-shadow:0 6px 0 rgba(0,0,0,.6),0 0 40px rgba(255,210,63,.55);transform:scale(1)}
  #countdown{background:transparent;pointer-events:none}
  .pop{animation:pop .9s ease-out}
  @keyframes pop{0%{transform:scale(1.8);opacity:0}18%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.85);opacity:0}}

  #results .card{background:rgba(12,16,38,.92);border:2px solid rgba(255,255,255,.18);border-radius:22px;padding:26px 34px;min-width:min(88vw,460px);
    box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #resultTitle{font-size:min(9vw,52px);font-weight:900;font-style:italic;margin-bottom:6px}
  #resultTitle.win{color:#ffd23f;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 26px rgba(255,210,63,.5)}
  #resultTitle.lose{color:#8fe3ff}
  #standings{width:100%;border-collapse:collapse;margin-top:12px;font-size:min(4vw,17px)}
  #standings td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left;color:#dfe6ff}
  #standings tr.me td{color:#ffd23f;font-weight:900;background:rgba(255,210,63,.08)}
  #standings td:first-child{font-weight:900;width:2.2em;color:#8fe3ff}
  #standings td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  #bestLapRes{margin-top:10px;color:#7cf29c;font-weight:800;font-size:min(3.6vw,15px)}

  #pauseOv .card{background:rgba(12,16,38,.9);border-radius:20px;padding:30px 50px;border:2px solid rgba(255,255,255,.15)}

  /* ---------- touch ---------- */
  #touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:4}
  .tbtn{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:18px;border:2px solid rgba(255,255,255,.5);
    background:rgba(20,24,50,.45);color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(2px)}
  .tbtn:active,.tbtn.on{background:rgba(255,93,114,.7);border-color:#fff}
  #tL{left:16px;bottom:26px}#tR{left:96px;bottom:26px}
  #tGas{right:16px;bottom:96px;background:rgba(40,224,255,.35)}
  #tBrk{right:96px;bottom:26px}
  #tNit{right:16px;bottom:176px;background:rgba(124,242,156,.35)}
  #tDft{right:96px;bottom:106px;background:rgba(255,210,63,.3)}
  @media (pointer:coarse){ #muteHint{display:none} }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="960" height="540"></canvas></div>

<div id="hud">
  <div id="lapBox"  class="chunk">VUELTA 1/3</div>
  <div id="timeBox" class="chunk">0'00"00</div>
  <div id="bestBox" class="chunk"></div>
  <div id="posBox">
    <div id="posVal" class="chunk">6</div>
    <div id="posOrd" class="chunk">POSICIÓN</div>
  </div>
  <div id="nitroWrap">
    <div id="nitroLabel" class="chunk">NITRO</div>
    <div id="nitroBar"><div id="nitroFill"></div></div>
  </div>
  <div id="speedBox">
    <div id="speedVal" class="chunk">0</div>
    <div id="speedUnit" class="chunk">km/h</div>
  </div>
  <div id="msgFlash" class="chunk"></div>
  <div id="muteHint">M silencio · P pausa</div>
</div>

<div id="touch">
  <div class="tbtn" id="tL">◀</div><div class="tbtn" id="tR">▶</div>
  <div class="tbtn" id="tGas">GAS</div><div class="tbtn" id="tBrk">FRENO</div>
  <div class="tbtn" id="tNit">NITRO</div><div class="tbtn" id="tDft">DRIFT</div>
</div>

<div id="title" class="overlay">
  <div class="sub">RESET FIRM PRESENTA</div>
  <h1>TURBO<br>PURSUIT</h1>
  <div class="badge">PROTOTIPO · PSEUDO-3D "MODE 7"</div>
  <button class="press" id="startBtn">▶ &nbsp;EMPEZAR CARRERA</button>
  <div class="controls">
    <b>↑/W</b> acelerar &nbsp; <b>↓/S</b> frenar &nbsp; <b>←→/AD</b> girar<br>
    <b>ESPACIO</b> derrape (carga mini-turbo) &nbsp; <b>SHIFT</b> nitro &nbsp; <b>P</b> pausa
  </div>
</div>

<div id="countdown" class="overlay hidden"><div id="countNum" class="chunk">3</div></div>

<div id="results" class="overlay hidden">
  <div class="card">
    <div id="resultTitle" class="win">¡VICTORIA!</div>
    <table id="standings"></table>
    <div id="bestLapRes"></div>
    <button class="press" id="againBtn" style="margin-top:18px">↻ &nbsp;OTRA CARRERA</button>
  </div>
</div>

<div id="pauseOv" class="overlay hidden"><div class="card"><div class="chunk" style="font-size:40px">PAUSA</div>
  <div style="margin-top:8px;color:#c9d4ff">pulsa <b>P</b> para seguir</div></div></div>

<script>
'use strict';
/* =====================================================================
   TURBO PURSUIT — prototipo de carreras arcade
   Motor pseudo-3D de segmentos (estilo OutRun / SNES "Mode 7").
   Todo autocontenido: gráficos vectoriales en canvas + audio WebAudio.
   ===================================================================== */

/* ---------- utilidades ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeIn=(a,b,p)=>a+(b-a)*p*p;
const easeOut=(a,b,p)=>a+(b-a)*(1-(1-p)*(1-p));
const easeInOut=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5);
function increase(v,inc,max){ let r=v+inc; while(r>=max)r-=max; while(r<0)r+=max; return r; }
function fmtTime(t){ if(t==null)return '—'; const m=Math.floor(t/60),s=Math.floor(t%60),c=Math.floor((t*100)%100);
  return m+"'"+String(s).padStart(2,'0')+'"'+String(c).padStart(2,'0'); }
const ORD=['1º','2º','3º','4º','5º','6º'];

/* ---------- constantes del mundo ---------- */
const W=960, H=540;
const SEG_LEN=200, RUMBLE=3, LANES=3;
const ROAD_W=2200;                 // medio ancho de la pista (unidades mundo)
const DRAW_DIST=300;               // segmentos dibujados
const FOV=100, CAM_H=1100;
const CAM_DEPTH=1/Math.tan((FOV/2)*Math.PI/180);
const PLAYER_Z=CAM_DEPTH*CAM_H;    // distancia del coche a la cámara
const FOG_DENSITY=4.2;
const LAPS=3;
const MAX_SPEED=SEG_LEN*60;        // 12000 u/s
const ACCEL=MAX_SPEED/5.2, BRAKE=-MAX_SPEED*1.05, DECEL=-MAX_SPEED/7;
const OFF_DECEL=-MAX_SPEED/1.4, OFF_LIMIT=MAX_SPEED/4;
const CENTRIF=0.315;
const CAR_W=660;                   // ancho mundo de un coche
const KMH=0.026;                   // velocidad→km/h mostrados

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

/* ---------- pista ---------- */
let segments=[], trackLength=0;
const lastY=()=>segments.length?segments[segments.length-1].p2.world.y:0;

function addSegment(curve,y){
  const n=segments.length;
  segments.push({
    index:n, curve,
    p1:{world:{x:0,y:lastY(),z:n*SEG_LEN},camera:{},screen:{}},
    p2:{world:{x:0,y:y,z:(n+1)*SEG_LEN},camera:{},screen:{}},
    color:Math.floor(n/RUMBLE)%2, sprites:[], cars:[],
    boost:false, finish:false, clip:0, projFrame:-1
  });
}
function addRoad(enter,hold,leave,curve,y){
  const sy=lastY(), ey=sy+(y||0)*SEG_LEN, total=enter+hold+leave;
  for(let i=0;i<enter;i++) addSegment(easeIn(0,curve,i/enter), easeInOut(sy,ey,i/total));
  for(let i=0;i<hold;i++)  addSegment(curve, easeInOut(sy,ey,(enter+i)/total));
  for(let i=0;i<leave;i++) addSegment(easeInOut(curve,0,i/leave), easeInOut(sy,ey,(enter+hold+i)/total));
}
const straight=n=>addRoad(n,n,n,0,0);
function markBoost(from,count){ for(let i=0;i<count;i++){ const s=segments[from+i]; if(s) s.boost=true; } }
function addSprite(i,type,offset,scale){ const s=segments[i%segments.length]; if(s) s.sprites.push({type,offset,scale:scale||1}); }

function scatterScenery(){
  const N=segments.length;
  for(let i=20;i<N;i+=9){
    const side=(i%2)?1:-1;
    const t=['palm','pine','palm','rock','pine'][i%5];
    addSprite(i, t, side*(1.35+((i*7)%10)/9*1.6), 0.85+((i*13)%10)/22);
    if(i%4===0) addSprite(i+3, ['pine','palm'][i%2], -side*(1.5+((i*11)%10)/8), 0.8+((i*3)%10)/25);
  }
  const ads=['NITRO COLA','SPEED BROS.','1-UP GARAGE','RETRO GP','STAR FUEL','KART KLUB'];
  for(let i=140;i<N-100;i+=340) addSprite(i,'billboard',(Math.floor(i/340)%2?1:-1)*1.55,1,segments[i].adText=ads[Math.floor(i/340)%ads.length]);
}

function buildTrack(){
  segments=[];
  straight(45);                       markBoost(60,4);
  addRoad(60,60,60, 2.2, 0);          // derecha suave
  addRoad(50,50,50,-3.4, 12);         // izquierda subiendo
  straight(30);
  addRoad(40,40,40, 0, -24);          // bajada
  addRoad(70,90,70, 4.6, 0);          // curvón derecha
  straight(50);                       markBoost(segments.length-30,4);
  addRoad(35,30,35,-4.2, 0);          // chicane
  addRoad(35,30,35, 4.2, 0);
  addRoad(45,45,45,-2.0, 20);         // izquierda subiendo
  addRoad(40,60,40, 0, -34);          // gran bajada
  addRoad(55,70,55,-4.8, 0);          // curvón izquierda
  straight(40);
  addRoad(50,40,50, 3.0, 14);
  addRoad(40,40,40,-2.6,-14);
  straight(70);                       markBoost(segments.length-50,4);
  // línea de meta al principio (segmentos 0-3)
  for(let i=0;i<4;i++) segments[i].finish=true;
  addSprite(6,'gate',0,1);
  scatterScenery();
  trackLength=segments.length*SEG_LEN;
}
const findSegment=z=>segments[Math.floor(z/SEG_LEN)%segments.length];

/* ---------- estado ---------- */
const keys={};
let state='title';           // title | countdown | racing | finished | paused
let prevState='racing';
let position=0, speed=0, playerX=0;
let boostTimer=0, nitro=1, nitroOn=false;
let drifting=false, driftCharge=0, driftDir=0;
let shake=0, raceTime=0, lapStart=0, lap=1, bestLap=null, lapTimes=[];
let prevPZ=0, countT=0, msgT=0, frameId=0;
let bgPar=0, bgPar2=0, cloudDrift=0, finishedDelay=0;
let padCooldown=0;

const RIVALS=[
  {name:'MIDNIGHT',    color:'#7b4dff', top:0.965},
  {name:'SAKURA',      color:'#ff7bc1', top:0.945},
  {name:'EL COMISARIO',color:'#3f77ff', top:0.975, cop:true},
  {name:'VENDETTA',    color:'#2ee6a8', top:0.935},
  {name:'TURBO-KID',   color:'#ffb23f', top:0.955},
];
let cars=[];
const PLAYER={name:'TÚ', color:'#ff3d54'};

function resetRace(){
  buildTrack();
  cars=[];
  // parrilla: rivales delante, jugador último (justo tras la meta)
  RIVALS.forEach((r,i)=>{
    const seg=findSegment(900+(i+1)*460);
    const car={ ...r, z:900+(i+1)*460, offset:(i%2?0.45:-0.45), speed:0,
      lap:1, finished:false, totalTime:null, steer:0, brake:false, boost:0 };
    seg.cars.push(car); cars.push(car);
  });
  position=increase(900-PLAYER_Z,0,trackLength);
  prevPZ=(position+PLAYER_Z)%trackLength;
  speed=0; playerX=0; nitro=1; boostTimer=0; nitroOn=false;
  drifting=false; driftCharge=0; shake=0;
  raceTime=0; lapStart=0; lap=1; bestLap=null; lapTimes=[]; finishedDelay=0;
  playerFinished=false; playerTotal=null; padCooldown=0;
}
let playerFinished=false, playerTotal=null;

/* =====================================================================
   AUDIO — motor, música chiptune, efectos. Todo sintetizado.
   ===================================================================== */
let AC=null, master=null, muted=false;
let engOsc=null, engSub=null, engGain=null, engFilter=null;
let skidGain=null, nitroGain=null, noiseBuf=null;
let musicTimer=null, musicStep=0, musicNext=0;

function makeNoise(){
  const b=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function initAudio(){
  if(AC) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=AC.createGain(); master.gain.value=0.8; master.connect(AC.destination);
  noiseBuf=makeNoise();
  // motor: sierra + sub cuadrada con filtro
  engGain=AC.createGain(); engGain.gain.value=0;
  engFilter=AC.createBiquadFilter(); engFilter.type='lowpass'; engFilter.frequency.value=900; engFilter.Q.value=2;
  engOsc=AC.createOscillator(); engOsc.type='sawtooth'; engOsc.frequency.value=55;
  engSub=AC.createOscillator(); engSub.type='square'; engSub.frequency.value=27;
  const subG=AC.createGain(); subG.gain.value=0.5;
  engOsc.connect(engFilter); engSub.connect(subG); subG.connect(engFilter);
  engFilter.connect(engGain); engGain.connect(master);
  engOsc.start(); engSub.start();
  // derrape (ruido filtrado)
  const skidSrc=AC.createBufferSource(); skidSrc.buffer=noiseBuf; skidSrc.loop=true;
  const skidF=AC.createBiquadFilter(); skidF.type='bandpass'; skidF.frequency.value=1400; skidF.Q.value=1.2;
  skidGain=AC.createGain(); skidGain.gain.value=0;
  skidSrc.connect(skidF); skidF.connect(skidGain); skidGain.connect(master); skidSrc.start();
  // nitro (soplido)
  const nSrc=AC.createBufferSource(); nSrc.buffer=noiseBuf; nSrc.loop=true;
  const nF=AC.createBiquadFilter(); nF.type='bandpass'; nF.frequency.value=2600; nF.Q.value=0.7;
  nitroGain=AC.createGain(); nitroGain.gain.value=0;
  nSrc.connect(nF); nF.connect(nitroGain); nitroGain.connect(master); nSrc.start();
  startMusic();
}
function beep(freq,dur,type,vol,when){
  if(!AC||muted)return;
  const t=when||AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
/* música: bajo + arpegio + hi-hat, compás alegre estilo consola */
const CHORDS=[[220,277.2,329.6],[185,220,277.2],[146.8,185,220],[164.8,207.7,246.9]]; // A F#m D E
function playStep(step,t){
  if(muted)return;
  const bar=Math.floor(step/8)%4, chord=CHORDS[bar], inBar=step%8;
  // bajo
  if(inBar%2===0) beep(chord[0]/2, 0.16, 'square', 0.10, t);
  // arpegio
  const arp=[0,1,2,1,0,2,1,2][inBar];
  beep(chord[arp]*2, 0.10, 'square', 0.055, t);
  if(inBar===6) beep(chord[2]*4,0.08,'triangle',0.05,t);
  // hi-hat
  const hs=AC.createBufferSource(); hs.buffer=noiseBuf;
  const hf=AC.createBiquadFilter(); hf.type='highpass'; hf.frequency.value=7000;
  const hg=AC.createGain(); const v=(inBar%2)?0.05:0.022;
  hg.gain.setValueAtTime(v,t); hg.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  hs.connect(hf); hf.connect(hg); hg.connect(master); hs.start(t); hs.stop(t+0.08);
}
function startMusic(){
  if(musicTimer||!AC)return;
  musicNext=AC.currentTime+0.1; musicStep=0;
  const spb=60/138/2; // corcheas a 138bpm
  musicTimer=setInterval(()=>{
    while(musicNext<AC.currentTime+0.12){
      if(state==='racing'||state==='countdown'||state==='finished') playStep(musicStep,musicNext);
      musicStep++; musicNext+=spb;
    }
  },30);
}
function audioFrame(dt){
  if(!AC)return;
  const ratio=speed/MAX_SPEED;
  const gear=(ratio*4.2)%1;
  const rpm=52+ratio*40+gear*130;
  const active=(state==='racing'||state==='finished');
  engOsc.frequency.setTargetAtTime(rpm,AC.currentTime,0.03);
  engSub.frequency.setTargetAtTime(rpm/2,AC.currentTime,0.03);
  engFilter.frequency.setTargetAtTime(500+ratio*2200,AC.currentTime,0.05);
  engGain.gain.setTargetAtTime((muted||!active)?0:0.05+ratio*0.075,AC.currentTime,0.08);
  skidGain.gain.setTargetAtTime((!muted&&drifting&&active)?0.09:0,AC.currentTime,0.05);
  nitroGain.gain.setTargetAtTime((!muted&&(nitroOn||boostTimer>0)&&active)?0.10:0,AC.currentTime,0.06);
}

/* =====================================================================
   ENTRADA
   ===================================================================== */
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()]=true; keys[e.code]=true;
  if(e.key==='Enter'){ if(state==='title') startRace(); else if(state==='finished'&&finishedDelay>2) restart(); }
  if(e.key.toLowerCase()==='m'){ muted=!muted; flash(muted?'SILENCIO':'SONIDO ON'); }
  if(e.key.toLowerCase()==='p'||e.key==='Escape'){
    if(state==='racing'){ prevState=state; state='paused'; show('pauseOv'); }
    else if(state==='paused'){ state=prevState; hide('pauseOv'); }
  }
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; keys[e.code]=false; });

const K={ left:()=>keys['arrowleft']||keys['a']||touchK.L,
          right:()=>keys['arrowright']||keys['d']||touchK.R,
          gas:()=>keys['arrowup']||keys['w']||touchK.G,
          brake:()=>keys['arrowdown']||keys['s']||touchK.B,
          nitro:()=>keys['shift']||keys['ShiftLeft']||keys['ShiftRight']||touchK.N,
          drift:()=>keys[' ']||keys['Space']||touchK.D };

const touchK={L:false,R:false,G:false,B:false,N:false,D:false};
function bindTouch(id,k){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();touchK[k]=true;el.classList.add('on')};
  const off=e=>{e.preventDefault();touchK[k]=false;el.classList.remove('on')};
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off);
  el.addEventListener('pointerleave',off); el.addEventListener('pointercancel',off);
}
[['tL','L'],['tR','R'],['tGas','G'],['tBrk','B'],['tNit','N'],['tDft','D']].forEach(([i,k])=>bindTouch(i,k));
const isTouch=matchMedia('(pointer:coarse)').matches;

const $=id=>document.getElementById(id);
const show=id=>$(id).classList.remove('hidden');
const hide=id=>$(id).classList.add('hidden');
$('startBtn').addEventListener('click',()=>{ if(state==='title') startRace(); });
$('againBtn').addEventListener('click',()=>{ if(state==='finished') restart(); });

function flash(txt,long){
  const el=$('msgFlash'); el.textContent=txt; el.style.opacity=1; msgT=long?2.2:1.2;
}

function startRace(){
  initAudio(); if(AC&&AC.state==='suspended')AC.resume();
  resultsShown=false;
  resetRace();
  hide('title'); hide('results'); show('countdown');
  $('hud').style.display='block';
  if(isTouch) $('touch').style.display='block';
  state='countdown'; countT=0; countShown=-1;
}
function restart(){ startRace(); }
let countShown=-1;

/* =====================================================================
   ACTUALIZACIÓN
   ===================================================================== */
function updateCountdown(dt){
  countT+=dt;
  const n=3-Math.floor(countT);
  if(n!==countShown&&n>=0){
    countShown=n;
    const el=$('countNum');
    el.textContent=n===0?'¡GO!':n;
    el.style.color=n===0?'#7cf29c':'#ffd23f';
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    if(AC&&!muted) beep(n===0?880:440, n===0?0.5:0.14, 'square', 0.22);
  }
  if(countT>=3.9){ hide('countdown'); state='racing'; lapStart=0; }
  // los rivales pueden "calentar" quietos; el jugador aún no se mueve
}

function updatePlayer(dt){
  const playerSeg=findSegment(position+PLAYER_Z);
  const ratio=speed/MAX_SPEED;

  // ---- dirección ----
  let steer=0;
  if(K.left())steer=-1; else if(K.right())steer=1;

  // ---- derrape ----
  const wantDrift=K.drift()&&speed>MAX_SPEED*0.3;
  if(wantDrift&&steer!==0&&!drifting){ drifting=true; driftDir=steer; driftCharge=0; }
  if(drifting){
    if(!K.drift()||speed<MAX_SPEED*0.22){
      // soltar: mini-turbo
      const lvl=driftCharge>2.0?2:driftCharge>0.9?1:0;
      if(lvl>0){ boostTimer=Math.max(boostTimer,lvl*0.85); flash(lvl===2?'¡TURBO NARANJA!':'¡MINI-TURBO!');
        if(AC&&!muted){beep(660,0.09,'square',0.15);beep(990,0.14,'square',0.15,AC.currentTime+0.07);} }
      drifting=false; driftCharge=0;
    } else driftCharge+=dt*(Math.abs(steer)>0?1:0.35);
  }

  const dx=dt*1.95*ratio*(drifting?(steer===driftDir?1.45:0.65):1);
  playerX+=dx*steer;
  playerX-=dx*ratio*playerSeg.curve*CENTRIF*(drifting?0.55:1);
  playerX=clamp(playerX,-2.6,2.6);

  // ---- nitro / turbo ----
  nitroOn=K.nitro()&&nitro>0&&speed>MAX_SPEED*0.15;
  if(nitroOn) nitro=Math.max(0,nitro-dt*0.30);
  else nitro=Math.min(1,nitro+dt*0.045);
  boostTimer=Math.max(0,boostTimer-dt);
  padCooldown=Math.max(0,padCooldown-dt);
  if(playerSeg.boost&&Math.abs(playerX)<0.95&&speed>0&&padCooldown<=0){
    boostTimer=Math.max(boostTimer,1.15); padCooldown=1.0; flash('¡BOOST!');
    if(AC&&!muted) beep(1320,0.25,'sawtooth',0.12);
  }
  const boostMul=1+(nitroOn?0.34:0)+(boostTimer>0?0.26:0);
  const effMax=MAX_SPEED*Math.min(boostMul,1.48);

  // ---- aceleración ----
  const offroad=Math.abs(playerX)>1.0;
  if(K.gas()) speed+=((nitroOn||boostTimer>0)?ACCEL*2.1:ACCEL)*dt;
  else if(K.brake()) speed+=BRAKE*dt;
  else speed+=DECEL*dt;
  if(offroad){
    if(speed>OFF_LIMIT) speed+=OFF_DECEL*dt;
    shake=Math.max(shake,3.5*ratio);
    // choques con decorado
    for(const s of playerSeg.sprites){
      const half=(s.type==='billboard'?0.32:s.type==='rock'?0.24:0.2)*s.scale;
      if(Math.abs(playerX-s.offset)<half+0.16&&speed>MAX_SPEED*0.12){
        speed=MAX_SPEED*0.1; shake=9; flash('¡CRASH!');
        if(AC&&!muted){beep(90,0.3,'sawtooth',0.3);beep(60,0.4,'square',0.25);}
        break;
      }
    }
  }
  speed=clamp(speed,0,effMax);

  // ---- avanzar + vueltas ----
  position=increase(position,speed*dt,trackLength);
  const pz=(position+PLAYER_Z)%trackLength;
  if(pz<prevPZ-trackLength/2){ // cruzó meta
    const lt=raceTime-lapStart; lapStart=raceTime; lapTimes.push(lt);
    if(bestLap==null||lt<bestLap){ bestLap=lt; if(lap>1) flash('¡MEJOR VUELTA!'); }
    lap++;
    if(lap>LAPS&&!playerFinished){
      playerFinished=true; playerTotal=raceTime; state='finished';
      if(AC&&!muted){[523,659,784,1047].forEach((f,i)=>beep(f,0.22,'square',0.16,AC.currentTime+i*0.12));}
    } else if(lap===LAPS) flash('¡ÚLTIMA VUELTA!',true);
  }
  prevPZ=pz;

  // ---- colisión con rivales ----
  const segIdx=findSegment(pz).index;
  for(let d=-1;d<=1;d++){
    const seg=segments[(segIdx+d+segments.length)%segments.length];
    for(const car of seg.cars){
      const dz=Math.abs(increase(car.z,-pz,trackLength));
      const near=Math.min(dz,trackLength-dz)<SEG_LEN*0.9;
      if(near&&Math.abs(playerX-car.offset)<0.42&&speed>car.speed){
        speed=car.speed*0.82; shake=Math.max(shake,5);
        if(AC&&!muted) beep(120,0.15,'sawtooth',0.2);
      }
    }
  }
  shake=Math.max(0,shake-dt*14);
}

function autopilot(dt){ // tras terminar: sigue rodando solo
  const seg=findSegment(position+PLAYER_Z);
  speed=Math.min(speed+ACCEL*0.5*dt, MAX_SPEED*0.75);
  playerX=lerp(playerX,clamp(-seg.curve*0.12,-0.5,0.5),dt*1.5);
  position=increase(position,speed*dt,trackLength);
  prevPZ=(position+PLAYER_Z)%trackLength;
  drifting=false; nitroOn=false;
}

function updateCars(dt){
  const playerProg=(lap-1)*trackLength+((position+PLAYER_Z)%trackLength);
  for(const car of cars){
    const seg=findSegment(car.z);
    // objetivo de velocidad: base, menos en curvas, banda elástica suave
    const curveSlow=1-Math.min(Math.abs(seg.curve)*0.045,0.26)*(1-((car.cop?0.3:0)));
    const prog=(car.lap-1)*trackLength+car.z;
    const gap=(playerProg-prog)/trackLength; // + = va detrás del jugador
    const rubber=clamp(1+gap*0.22,0.92,1.10);
    let target=MAX_SPEED*car.top*curveSlow*rubber;
    if(state==='countdown'){ target=0; }
    car.speed+= clamp(target-car.speed, -MAX_SPEED*dt, ACCEL*0.85*dt);
    car.brake=target<car.speed-MAX_SPEED*0.05;
    // dirección: trazada + esquivar
    let want=clamp(-seg.curve*0.09,-0.6,0.6);
    for(const other of cars){
      if(other===car)continue;
      const dz=increase(other.z,-car.z,trackLength);
      if(dz>0&&dz<SEG_LEN*14&&Math.abs(other.offset-car.offset)<0.5)
        want=other.offset>car.offset?car.offset-0.5:car.offset+0.5;
    }
    // esquivar al jugador
    const pz=(position+PLAYER_Z)%trackLength;
    const dzp=increase(pz,-car.z,trackLength);
    if(dzp>0&&dzp<SEG_LEN*9&&Math.abs(playerX-car.offset)<0.45)
      want=playerX>car.offset?car.offset-0.45:car.offset+0.45;
    want=clamp(want,-0.8,0.8);
    car.steer=clamp(want-car.offset,-1,1);
    car.offset+=clamp(want-car.offset,-dt*0.55,dt*0.55);
    // avanzar
    const oldZ=car.z;
    car.z=increase(car.z,car.speed*dt,trackLength);
    if(car.z<oldZ&&car.speed>0){ // cruzó meta
      car.lap++;
      if(car.lap>LAPS&&!car.finished){ car.finished=true; car.totalTime=raceTime; }
    }
    const newSeg=findSegment(car.z);
    if(newSeg!==seg){ seg.cars.splice(seg.cars.indexOf(car),1); newSeg.cars.push(car); }
  }
}

function standings(){
  const pz=(position+PLAYER_Z)%trackLength;
  const list=cars.map(c=>({name:c.name,color:c.color,me:false,fin:c.finished,t:c.totalTime,
    prog:(c.lap-1)*trackLength+c.z}));
  list.push({name:PLAYER.name,color:PLAYER.color,me:true,fin:playerFinished,t:playerTotal,
    prog:(Math.min(lap,LAPS+1)-1)*trackLength+pz});
  list.sort((a,b)=>{
    if(a.fin&&b.fin)return a.t-b.t;
    if(a.fin!==b.fin)return a.fin?-1:1;
    return b.prog-a.prog;
  });
  return list;
}

   RENDER
   ===================================================================== */
function project(p,camX,camY,camZ){
  p.camera.x=(p.world.x||0)-camX;
  p.camera.y=(p.world.y||0)-camY;
  p.camera.z=(p.world.z||0)-camZ;
  p.screen.scale=CAM_DEPTH/p.camera.z;
  p.screen.x=Math.round(W/2+p.screen.scale*p.camera.x*W/2);
  p.screen.y=Math.round(H/2-p.screen.scale*p.camera.y*H/2);
  p.screen.w=Math.round(p.screen.scale*ROAD_W*W/2);
}
const fogAmt=(d,density)=>1/Math.exp(d*d*density);
const FOG_COLOR='#bfe3f2';

function poly(x1,y1,x2,y2,x3,y3,x4,y4,color){
  ctx.fillStyle=color; ctx.beginPath();
  ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);
  ctx.closePath();ctx.fill();
}

function renderBackground(){
  // cielo
  const g=ctx.createLinearGradient(0,0,0,H*0.62);
  g.addColorStop(0,'#2f8fe6');g.addColorStop(0.55,'#6fc4f5');g.addColorStop(1,'#cdeffb');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.62);
  // sol
  const sx=W*0.72-bgPar*0.15, sy=H*0.20;
  const sg=ctx.createRadialGradient(sx,sy,4,sx,sy,90);
  sg.addColorStop(0,'rgba(255,246,200,1)');sg.addColorStop(0.25,'rgba(255,230,140,.9)');sg.addColorStop(1,'rgba(255,230,140,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,90,0,7);ctx.fill();
  ctx.fillStyle='#fff8d8';ctx.beginPath();ctx.arc(sx,sy,26,0,7);ctx.fill();
  // nubes
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(let i=0;i<6;i++){
    const cx=((i*230+cloudDrift-bgPar*(0.25+i*0.04))%(W+260))-130;
    const cy=40+((i*67)%120), s=0.7+(i%3)*0.3;
    for(const [ox,oy,rx,ry] of [[0,0,42,15],[28,-8,26,13],[-30,-4,24,11]]){
      ctx.beginPath();ctx.ellipse(cx+ox*s,cy+oy*s,rx*s,ry*s,0,0,7);ctx.fill();
    }
  }
  // montañas lejanas
  drawRange(H*0.52,60,'#8fd0e8',bgPar*0.35,0.010,17);
  drawRange(H*0.56,78,'#5aa8c9',bgPar*0.7,0.016,29);
  // colinas verdes cercanas
  drawRange(H*0.60,46,'#68b85c',bgPar*1.15,0.021,7);
}
function drawRange(baseY,amp,color,shift,freq,seed){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=16){
    const wx=x+shift;
    const y=baseY - (Math.sin(wx*freq+seed)*0.6+Math.sin(wx*freq*2.7+seed*2)*0.4+1)*amp*0.5;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}

function renderSegment(seg,x1,y1,w1,x2,y2,w2){
  const alt=seg.color;
  const grass = alt?'#6cc44f':'#5eb843';
  const road  = alt?'#969ca8':'#8c92a0';
  const rumble= alt?'#f2f2f0':'#e8483f';
  const lane  = '#f6f6f2';
  ctx.fillStyle=grass; ctx.fillRect(0,y2,W,Math.max(y1-y2,1));
  const r1=w1/6,r2=w2/6;
  poly(x1-w1-r1,y1,x1-w1,y1,x2-w2,y2,x2-w2-r2,y2,rumble);
  poly(x1+w1+r1,y1,x1+w1,y1,x2+w2,y2,x2+w2+r2,y2,rumble);
  if(seg.finish){
    // cuadros de meta
    const cols=8;
    for(let i=0;i<cols;i++){
      const c=((i+seg.index)%2)?'#f5f5f5':'#20222c';
      const a1=-1+2*i/cols, a2=-1+2*(i+1)/cols;
      poly(x1+w1*a1,y1,x1+w1*a2,y1,x2+w2*a2,y2,x2+w2*a1,y2,c);
    }
    return;
  }
  poly(x1-w1,y1,x1+w1,y1,x2+w2,y2,x2-w2,y2,road);
  if(seg.boost){
    // flechas turbo
    const bc=(Math.floor(seg.index/2)%2)?'#37d3ff':'#7cf29c';
    poly(x1-w1*0.45,y1,x1+w1*0.45,y1,x2+w2*0.30,y2,x2-w2*0.30,y2,bc);
  } else if(alt){
    const l1=w1/28,l2=w2/28;
    for(let i=1;i<LANES;i++){
      const f=-1+2*i/LANES;
      poly(x1+w1*f-l1,y1,x1+w1*f+l1,y1,x2+w2*f+l2,y2,x2+w2*f-l2,y2,lane);
    }
  }
}
function applyFog(y1,y2,fog){
  if(fog>=0.99)return;
  ctx.globalAlpha=1-fog; ctx.fillStyle=FOG_COLOR;
  ctx.fillRect(0,y2,W,y1-y2+1); ctx.globalAlpha=1;
}

/* ---------- sprites vectoriales ---------- */
function drawSpriteType(type,x,bottomY,w,extra){
  ctx.save(); ctx.translate(x,bottomY); const s=w/100; ctx.scale(s,s);
  ctx.lineWidth=3; ctx.lineJoin='round';
  if(type==='palm'){
    ctx.strokeStyle='#7a4a26'; ctx.lineWidth=9; ctx.beginPath();
    ctx.moveTo(0,0); ctx.quadraticCurveTo(12,-60,4,-110); ctx.stroke();
    ctx.fillStyle='#2f9e44';
    for(let a=0;a<6;a++){
      const ang=-Math.PI/2+(a-2.5)*0.5;
      ctx.beginPath(); ctx.moveTo(4,-110);
      ctx.quadraticCurveTo(4+Math.cos(ang)*55,-110+Math.sin(ang)*55-10, 4+Math.cos(ang)*78,-110+Math.sin(ang)*78+16);
      ctx.quadraticCurveTo(4+Math.cos(ang)*50,-110+Math.sin(ang)*50+14, 4,-106);
      ctx.fill();
    }
  } else if(type==='pine'){
    ctx.fillStyle='#7a4a26'; ctx.fillRect(-6,-18,12,18);
    ctx.fillStyle='#1e8e3e';
    ctx.beginPath();ctx.moveTo(-48,-14);ctx.lineTo(48,-14);ctx.lineTo(0,-66);ctx.fill();
    ctx.fillStyle='#22a04a';
    ctx.beginPath();ctx.moveTo(-38,-48);ctx.lineTo(38,-48);ctx.lineTo(0,-94);ctx.fill();
    ctx.fillStyle='#2bb457';
    ctx.beginPath();ctx.moveTo(-27,-80);ctx.lineTo(27,-80);ctx.lineTo(0,-118);ctx.fill();
  } else if(type==='rock'){
    ctx.fillStyle='#9aa1ad';
    ctx.beginPath();ctx.moveTo(-42,0);ctx.lineTo(-26,-34);ctx.lineTo(4,-44);ctx.lineTo(34,-22);ctx.lineTo(44,0);ctx.fill();
    ctx.fillStyle='#7d8592';
    ctx.beginPath();ctx.moveTo(4,-44);ctx.lineTo(34,-22);ctx.lineTo(44,0);ctx.lineTo(12,0);ctx.fill();
  } else if(type==='billboard'){
    ctx.fillStyle='#5d4632'; ctx.fillRect(-8,-70,16,70);
    ctx.fillStyle='#fffdf5'; ctx.strokeStyle='#20222c'; ctx.lineWidth=5;
    ctx.beginPath(); if(ctx.roundRect)ctx.roundRect(-70,-135,140,68,10); else ctx.rect(-70,-135,140,68);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#e01f3d'; ctx.font='900 26px system-ui'; ctx.textAlign='center';
    ctx.fillText(extra||'TURBO',0,-93);
  } else if(type==='gate'){
    // pórtico de salida sobre la pista
    ctx.fillStyle='#20222c';
    ctx.fillRect(-150,-120,16,120); ctx.fillRect(134,-120,16,120);
    ctx.fillStyle='#e01f3d'; ctx.fillRect(-150,-140,300,34);
    ctx.fillStyle='#fff'; ctx.font='900 24px system-ui'; ctx.textAlign='center';
    ctx.fillText('TURBO PURSUIT',0,-116);
  }
  ctx.restore();
}
const SPRITE_W={palm:950,pine:900,rock:820,billboard:1350,gate:1550};

/* ---------- coches ---------- */
function drawCar(x,bottomY,w,color,steer,opts){
  opts=opts||{};
  ctx.save(); ctx.translate(x,bottomY);
  const s=w/104; ctx.scale(s,s);
  // sombra
  ctx.fillStyle='rgba(0,0,0,.35)';

  ctx.rotate(clamp(steer,-1,1)*0.07);
  ctx.lineJoin='round';
  // llamas de nitro
  if(opts.flame){
    ctx.globalCompositeOperation='lighter';
    for(const ex of [-24,24]){
      const len=14+Math.random()*16;
      ctx.fillStyle='rgba(255,140,40,.85)';
      ctx.beginPath();ctx.moveTo(ex-6,-6);ctx.lineTo(ex+6,-6);ctx.lineTo(ex,len-4);ctx.fill();
      ctx.fillStyle='rgba(255,235,140,.9)';
      ctx.beginPath();ctx.moveTo(ex-3,-6);ctx.lineTo(ex+3,-6);ctx.lineTo(ex,len*0.55-4);ctx.fill();
    }

  if(opts.spark){
    ctx.fillStyle=opts.spark===2?'#ffb23f':'#37d3ff';

  ctx.beginPath();if(ctx.roundRect){ctx.roundRect(-54,-18,15,18,4);ctx.roundRect(39,-18,15,18,4);}else{ctx.rect(-54,-18,15,18);ctx.rect(39,-18,15,18);}ctx.fill();
  // carrocería

  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-48,-34,96,30,9);else ctx.rect(-48,-34,96,30);
  ctx.fill();ctx.stroke();
  // parachoques
  ctx.fillStyle=shade(color,-40);
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-50,-14,100,11,5);else ctx.rect(-50,-14,100,11);ctx.fill();
  // banda de luces traseras
  ctx.fillStyle='#3a0d14';
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-40,-30,80,8,4);else ctx.rect(-40,-30,80,8);ctx.fill();
  ctx.fillStyle=opts.brake?'#ff5d5d':'#c22633';
  if(opts.brake){ctx.shadowColor='#ff3d54';ctx.shadowBlur=14;}
  ctx.fillRect(-38,-29,26,6); ctx.fillRect(12,-29,26,6);
  ctx.shadowBlur=0;
  // cabina
  ctx.fillStyle=shade(color,-18);
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-32,-56,64,26,10);else ctx.rect(-32,-56,64,26);
  ctx.fill();ctx.stroke();
  const wg=ctx.createLinearGradient(0,-54,0,-36);
  wg.addColorStop(0,'#cfeeff');wg.addColorStop(1,'#5f93c9');
  ctx.fillStyle=wg;
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-26,-52,52,16,7);else ctx.rect(-26,-52,52,16);ctx.fill();
  // alerón
  ctx.fillStyle=shade(color,-35);
  ctx.fillRect(-40,-63,8,9); ctx.fillRect(32,-63,8,9);
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-46,-68,92,7,3);else ctx.rect(-46,-68,92,7);ctx.fill();
  // sirena de policía
  if(opts.cop){
    ctx.fillStyle=(Math.floor(performance.now()/160)%2)?'#ff3b3b':'#3f8bff';
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;
    ctx.fillRect(-12,-62,24,7); ctx.shadowBlur=0;
  }
  ctx.restore();
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);
  return `rgb(${r},${g},${b})`;
}

function render(dt){
  frameId++;
  const baseSeg=findSegment(position);
  const basePct=(position%SEG_LEN)/SEG_LEN;
  const playerSeg=findSegment(position+PLAYER_Z);
  const playerPct=((position+PLAYER_Z)%SEG_LEN)/SEG_LEN;
  const playerY=lerp(playerSeg.p1.world.y,playerSeg.p2.world.y,playerPct);
  const speedRatio=speed/MAX_SPEED;

  // parallax de fondo
  bgPar+=playerSeg.curve*speedRatio*dt*220;
  cloudDrift+=dt*6;

  ctx.save();
  const shx=(Math.random()-0.5)*shake*2, shy=(Math.random()-0.5)*shake*2;
  ctx.translate(shx,shy);

  renderBackground();

  // ---- pista ----
  let maxy=H, x=0, dx=-(baseSeg.curve*basePct);
  const camY=playerY+CAM_H;
  for(let n=0;n<DRAW_DIST;n++){
    const seg=segments[(baseSeg.index+n)%segments.length];
    const looped=seg.index<baseSeg.index;
    seg.fog=fogAmt(n/DRAW_DIST,FOG_DENSITY);
    seg.clip=maxy;
    project(seg.p1, playerX*ROAD_W-x,    camY, position-(looped?trackLength:0));
    project(seg.p2, playerX*ROAD_W-x-dx, camY, position-(looped?trackLength:0));
    seg.projFrame=frameId;
    x+=dx; dx+=seg.curve;
    if(seg.p1.camera.z<=CAM_DEPTH||seg.p2.screen.y>=maxy||seg.p2.screen.y>=seg.p1.screen.y) continue;
    renderSegment(seg,seg.p1.screen.x,seg.p1.screen.y,seg.p1.screen.w,
                      seg.p2.screen.x,seg.p2.screen.y,seg.p2.screen.w);
    applyFog(seg.p1.screen.y,seg.p2.screen.y,seg.fog);
    maxy=seg.p1.screen.y;
  }

  // ---- sprites y coches (de lejos a cerca) ----
  for(let n=DRAW_DIST-1;n>0;n--){
    const seg=segments[(baseSeg.index+n)%segments.length];
    if(seg.projFrame!==frameId||seg.p1.camera.z<=CAM_DEPTH)continue;
    const clipY=seg.clip;
    for(const car of seg.cars){
      const pct=(car.z%SEG_LEN)/SEG_LEN;
      const sc=lerp(seg.p1.screen.scale,seg.p2.screen.scale,pct);
      const cx=lerp(seg.p1.screen.x,seg.p2.screen.x,pct)+sc*car.offset*ROAD_W*W/2;
      const cy=lerp(seg.p1.screen.y,seg.p2.screen.y,pct);
      const cw=sc*CAR_W*W/2;
      if(cw<2||cy>H+80)continue;
      ctx.save();ctx.beginPath();ctx.rect(-20,-20,W+40,clipY+20);ctx.clip();
      ctx.globalAlpha=Math.max(seg.fog,0.25);
      drawCar(cx,cy,cw,car.color,car.steer*2,{brake:car.brake,cop:car.cop});
      ctx.globalAlpha=1;ctx.restore();
    }
    for(const s of seg.sprites){
      const sc=seg.p1.screen.scale;
      const sw=sc*SPRITE_W[s.type]*s.scale*W/2;
      if(sw<3)continue;
      const sx=seg.p1.screen.x+sc*s.offset*ROAD_W*W/2;
      const sy=seg.p1.screen.y;
      ctx.save();ctx.beginPath();ctx.rect(-20,-20,W+40,clipY+20);ctx.clip();
      ctx.globalAlpha=Math.max(seg.fog,0.2);
      drawSpriteType(s.type,sx,sy,sw,seg.adText);
      ctx.globalAlpha=1;ctx.restore();
    }
  }

  // ---- coche del jugador ----
  const bounce=Math.sin(performance.now()/45)*speedRatio*1.6;
  const steer=(K.left()?-1:0)+(K.right()?1:0);
  const pw=CAR_W*W/(2*CAM_H)*1.06;
  const sparkLvl=drifting?(driftCharge>2?2:driftCharge>0.9?1:0):0;
  drawCar(W/2+(drifting?driftDir*6:0), H-12+bounce, pw, PLAYER.color,
    steer*(drifting?1.9:1),
    {flame:(nitroOn||boostTimer>0), brake:K.brake(), spark:sparkLvl});

  // líneas de velocidad con nitro
  if(nitroOn||boostTimer>0){
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;
    for(let i=0;i<10;i++){
      const a=Math.random()*Math.PI*2, r1=H*0.35+Math.random()*60, r2=r1+40+Math.random()*80;
      ctx.beginPath();
      ctx.moveTo(W/2+Math.cos(a)*r1,H/2+Math.sin(a)*r1*0.7);
      ctx.lineTo(W/2+Math.cos(a)*r2,H/2+Math.sin(a)*r2*0.7);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- HUD ---------- */
let hudCache={};
function setText(id,v){ if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v;} }
function renderHUD(dt){
  setText('speedVal',String(Math.round(speed*KMH)));
  $('nitroFill').style.width=(nitro*100).toFixed(1)+'%';
  $('nitroFill').style.background=nitroOn?'linear-gradient(90deg,#ffd23f,#ff7b3d)':'linear-gradient(90deg,#28e0ff,#7cf29c)';
  setText('lapBox','VUELTA '+Math.min(lap,LAPS)+'/'+LAPS);
  setText('timeBox',fmtTime(raceTime));
  setText('bestBox',bestLap?('MEJOR: '+fmtTime(bestLap)):'');
  const st=standings(), pos=st.findIndex(s=>s.me)+1;
  setText('posVal',String(pos));
  setText('posOrd',pos===1?'¡LÍDER!':'POSICIÓN');
  if(msgT>0){ msgT-=dt; if(msgT<=0)$('msgFlash').style.opacity=0; }
}

function showResults(){
  const st=standings();
  const pos=st.findIndex(s=>s.me)+1;
  const t=$('resultTitle');
  if(pos===1){t.textContent='¡VICTORIA!';t.className='win';}
  else if(pos<=3){t.textContent='¡PODIO! '+ORD[pos-1];t.className='win';}
  else{t.textContent=ORD[pos-1]+' PUESTO';t.className='lose';}
  const tbl=$('standings');
  tbl.innerHTML=st.map((s,i)=>
    `<tr class="${s.me?'me':''}"><td>${ORD[i]}</td>`+
    `<td><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${s.color};margin-right:8px"></span>${s.name}</td>`+
    `<td>${s.fin?fmtTime(s.t):'—'}</td></tr>`).join('');
  $('bestLapRes').textContent=bestLap?('⚡ Mejor vuelta: '+fmtTime(bestLap)):'';
  show('results');
}
let resultsShown=false;

/* =====================================================================
   BUCLE PRINCIPAL
   ===================================================================== */
let lastT=performance.now(), acc=0; const STEP=1/60;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min((now-lastT)/1000,0.1); lastT=now;
  if(state==='paused'){ return; }
  acc+=dt;
  while(acc>=STEP){
    if(state==='countdown'){ updateCountdown(STEP); updateCars(STEP); }
    else if(state==='racing'){ raceTime+=STEP; updatePlayer(STEP); updateCars(STEP); }
    else if(state==='finished'){
      raceTime+=STEP; autopilot(STEP); updateCars(STEP); finishedDelay+=STEP;
      if(finishedDelay>1.6&&!resultsShown){ resultsShown=true; showResults(); }
    }
    acc-=STEP;
  }
  if(state!=='title'){ render(dt); renderHUD(dt); audioFrame(dt); }
  else renderTitleBG(dt);
}
/* fondo animado del título: la cámara rueda sola */
function renderTitleBG(dt){
  if(!segments.length){ buildTrack(); position=0; }
  speed=MAX_SPEED*0.55;
  position=increase(position,speed*dt,trackLength);
  const seg=findSegment(position+PLAYER_Z);
  playerX=lerp(playerX,clamp(-seg.curve*0.1,-0.4,0.4),dt);
  prevPZ=(position+PLAYER_Z)%trackLength;
  render(dt);
  speed=0;
}
buildTrack();
requestAnimationFrame(frame);
</script>
